<script>
const $=s=>document.querySelector(s),cv=$('#c');let g=cv.getContext('2d');
const rnd=(a,b)=>a+Math.random()*(b-a),cl=(v,a,b)=>Math.max(a,Math.min(b,v)),rgb=a=>`rgb(${a.map(Math.round)})`;
let W=900,H=500,SA=0;
function rs(){const d=devicePixelRatio||1;cv.width=innerWidth*d;cv.height=innerHeight*d;const s=innerHeight/H;W=innerWidth/s;SA=$('#sa').offsetHeight/s;g.setTransform(d*s,0,0,d*s,0,0);g.imageSmoothingQuality='high'}

/* ---------- save ---------- */
const DEF={cr:0,best:0,md:0,own:[1,0,0,0],sel:0,up:[0,0,0],ach:{},tot:{c:0,g:0,r:0},ms:null,mute:0,egg:0,sb:[],pn:'Player',tr:0,ot:[1]};
let S;try{S=Object.assign({},DEF,JSON.parse(localStorage.getItem('lumina')||'{}'))}catch(e){S=Object.assign({},DEF)}
S.tot=Object.assign({},DEF.tot,S.tot);S.up=Array.from({length:10},(_,i)=>S.up[i]||0);if(!Array.isArray(S.osk))S.osk=[1];if(!Array.isArray(S.inv))S.inv=[0,0,0,0];S.sk=S.sk||0;if(!Array.isArray(S.sb))S.sb=[];if(!Array.isArray(S.ot))S.ot=[1];S.pn=String(S.pn||'Player').replace(/[^a-zA-Z0-9 ]/g,'').slice(0,12)||'Player';
const save=()=>{try{localStorage.setItem('lumina',JSON.stringify(S))}catch(e){}};
/* ---------- data ---------- */
const CH=[{n:'Pip',c:'#7fd6ff',p:0},{n:'Fenn',c:'#ff9a5c',p:150},{n:'Moss',c:'#8be58b',p:400},{n:'Nova',c:'#ffe27a',p:0,sec:1},{n:'Rosie',c:'#ff8fd0',p:250},{n:'Ember',c:'#ff5a5a',p:600},{n:'Teal',c:'#4de3c8',p:900},{n:'Violet',c:'#b48cff',p:1200}];
const UP=[['Magnet Charm','Magnet lasts longer'],['Aegis Bubble','Shield lasts longer'],['Crystal Luck','+20% crystal value'],['Chrono Charm','Slow Time lasts +1s'],['Double Down','x2 lasts +2s'],['Head Start','Begin runs with +2s shield'],['Comet Fuel','Comet Dash lasts +0.6s'],['Featherweight','Feather Float lasts +2s'],['Nova Power','Pulse pays +1 crystal per hazard'],['Lucky Charm','More power-ups and Moon Gems']];
const TR=[['Classic',0,null],['Ember Trail',200,'#ff8a3d'],['Toxic Goo',300,'#8cff4a'],['Stardust',350,'#fffbe0'],['Rainbow',500,'rb'],['Aurora',700,'au'],['Bubblegum',250,'#ff8fd0'],['Frostbite',320,'#9fe8ff']];
const OS=[['Glass',0,null],['Lava',250,'#ff6a2a'],['Frost',300,'#9fe8ff'],['Galaxy',450,'#8a6bff'],['Candy',400,'#ff8fd0'],['Golden',800,'#ffd24d']];
const BO=[['Shield Pack',90,'shield','Start a run shielded (10s)'],['Comet Start',150,'comet','Begin with a Comet Dash'],['Double Start',110,'x2','x2 crystals for 20s'],['Revive Heart',220,'heart','Survive one fatal hit']];
const PI={shd:'shield',mag:'magnet',slow:'hourglass',x2:'x2',comet:'comet',pulse:'pulse',feather:'feather',shower:'shower'},PC={shd:'#5ec8ff',mag:'#ff5d6c',slow:'#ffd86b',x2:'#ffa94d',comet:'#ff9a3d',pulse:'#fff08a',feather:'#c9f2ff',shower:'#7fe8ff'},PN={shd:'SHIELD',mag:'MAGNET',slow:'SLOW TIME',x2:'DOUBLE CRYSTALS',comet:'COMET DASH!',pulse:'NOVA PULSE!',feather:'FEATHER FLOAT',shower:'CRYSTAL SHOWER'},PD={shd:'Absorbs one hit',mag:'Pulls crystals in',slow:'World slows down',x2:'Crystals count double',comet:'Invincible speed burst, auto-collects',pulse:'Blasts every hazard on screen',feather:'Low gravity, floaty control',shower:'Rains a river of crystals'};
function tcol(){const t=TR[S.tr][2];if(!t)return CH[S.sel].c;if(t=='rb')return `hsl(${T*200%360},100%,65%)`;if(t=='au')return `hsl(${150+Math.sin(T*2)*70},90%,65%)`;return t}
const B=[{n:'Glow Hollow',t:[16,22,62],b:[52,40,110],a:'#7fd6ff',f:[30,38,92],s:0},
{n:'Mushroom Marsh',t:[14,40,48],b:[40,90,86],a:'#ff8fd0',f:[24,62,64],s:1},
{n:'Crystal Peaks',t:[36,48,104],b:[120,150,210],a:'#c9f2ff',f:[56,72,130],s:2},
{n:'Void Garden',t:[18,6,38],b:[74,24,92],a:'#ffd86b',f:[40,16,66],s:3}];
const MP=[['c','Collect {n} crystals',[40,90,180]],['d','Travel {n} m',[600,1200,2400]],['b','Bounce {n} times',[25,60,120]],['p','Grab {n} power-ups',[2,4,7]],['n','Pull {n} near-misses',[6,12,25]]];
function newM(){let m;do{const p=MP[Math.random()*5|0],t=Math.random()*3|0;m={k:p[0],tx:p[1],n:p[2][t],v:0,r:50+t*60}}while(S.ms.some(o=>o.k==m.k));return m}
if(!Array.isArray(S.ms)||S.ms.length<3){S.ms=[];while(S.ms.length<3)S.ms.push(newM())}
const AC_=[['m300','First Glow','Reach 300 m',()=>S.md>=300],['m1000','Deep Diver','Reach 1000 m',()=>S.md>=1000],['bio','Marsh Walker','Reach Mushroom Marsh',()=>S.md>=600],['bio3','Void Wanderer','Reach Void Garden',()=>S.md>=1800],
['rich','Crystal Hoarder','Collect 500 crystals total',()=>S.tot.c>=500],['shop','New Friend','Own 2 characters',()=>S.own.filter(x=>x).length>=2],['gem','Moon Touched','Find a Moon Gem',()=>S.tot.g>=1],['near','Daredevil','15 near-misses in one run',()=>R&&R.near>=15],['best','Legend','Score 5000',()=>S.best>=5000],['trl','Style Icon','Buy an orb trail',()=>S.ot.filter(x=>x).length>=2],['full','Fully Charged','Max out an upgrade',()=>S.up.some(v=>v>=5)]];
function unlock(id,n){if(!S.ach[id]){S.ach[id]=1;S.cr+=25;toast('Trophy unlocked: '+n+' (+25 crystals)');save()}}
function chk(){if(S.tot.g>=3)S.own[3]=1;AC_.forEach(a=>{try{if(a[3]())unlock(a[0],a[1])}catch(e){}})}
/* ---------- audio ---------- */
let AX;function ac(){if(!AX){try{AX=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AX&&AX.state=='suspended')AX.resume();return AX}
function tone(f,d,ty,v,sl,dl){if(S.mute)return;const a=ac();if(!a)return;const t=a.currentTime+(dl||0),o=a.createOscillator(),n=a.createGain();o.type=ty||'sine';o.frequency.setValueAtTime(f,t);if(sl)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+sl),t+d);n.gain.setValueAtTime(v||.1,t);n.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(n);n.connect(a.destination);o.start(t);o.stop(t+d)}
const sfx={cr:()=>tone(780+Math.min(R?R.cs:0,12)*55,.13,'triangle',.09),bn:()=>tone(160,.18,'sine',.16,-70),pw:()=>{tone(520,.12,'square',.05);tone(780,.12,'square',.05,0,.08);tone(1040,.2,'square',.05,0,.16)},gm:()=>[0,1,2,3].forEach(i=>tone(600+i*200,.25,'sine',.09,0,i*.07)),nm:()=>tone(1200,.08,'sawtooth',.04,300),sh:()=>tone(300,.3,'sawtooth',.08,-200),dd:()=>{tone(220,.6,'sawtooth',.14,-180);tone(90,.7,'square',.1,-40)},bt:()=>tone(520,.06,'triangle',.05)};
const sc5=[0,2,4,7,9,12,14,16];let stp=0;
setInterval(()=>{if(S.mute||!AX||st=='pause')return;const r=[0,0,3,5,7,3,5,2][stp%8]+[0,0,-2,-5][bi%4]*0;tone(220*Math.pow(2,(sc5[(stp*3+(stp>>3))%8]+[0,2,5,-2][bi])/12),.5,'triangle',.028);if(stp%4==0)tone(55*Math.pow(2,[0,3,5,-2][bi]/12),.9,'sine',.05);stp++},300);
function mute(){S.mute=S.mute?0:1;tb();save();ac()}
/* ---------- state ---------- */
let ring=null,st='menu',cam=0,hold=0,R=null,P={y:250,vy:0,sq:0},ps=[],pp=[],CR=[],OB=[],T=0,sh=0,bi=0,fl_=0;
const cc={t:[...B[0].t],b:[...B[0].b],f:[...B[0].f]};
const FL=()=>H-56,CE=46,PX=()=>Math.min(W*.27,230);
const mo=[...Array(46)].map(()=>({x:Math.random()*1200,y:Math.random()*400,z:rnd(.05,.5),r:rnd(.6,2.2),p:rnd(0,6)}));
const spd=()=>(255+Math.min(R?R.dist*.045:0,330))*(R&&R.slow>0?.62:1)*(R&&R.comet>0?1.7:1)*(st=='intro'?1.3:1);
function toast(s){const t=$('#toast');t.textContent=s;t.style.opacity=1;clearTimeout(t._t);t._t=setTimeout(()=>t.style.opacity=0,2200)}
function emit(x,y,n,c,sp,l){for(let i=0;i<n;i++){const a=rnd(0,6.28),v=rnd(.2,1)*(sp||120);ps.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:rnd(.4,1)*(l||.8),m:(l||.8),c,s:rnd(1.5,3.5)})}}
function pop(x,y,s,c){pp.push({x,y,s,c:c||'#fff',l:1})}
function addM(k,a){S.ms.forEach((m,i)=>{if(m.k==k&&m.v<m.n){m.v=Math.min(m.n,m.v+a);if(m.v>=m.n){S.cr+=m.r;toast('Mission complete! +'+m.r+' crystals');S.ms[i]=newM();save()}}})}
/* ---------- run control ---------- */
function start(){ac();R={t:0,dist:0,cr:0,gems:0,near:0,bnc:0,pw:0,shd:0,mag:0,slow:0,x2:0,inv:0,nx:W+320,ban:3,cs:0,ct:0,lb:0};cam=0;P.y=250;P.vy=0;OB=[];CR=[];ps=[];pp=[];bi=0;R.shd=S.up[5]*2;R.inv=1.2;if(S.inv[0]>0){S.inv[0]--;R.shd=Math.max(R.shd,10)}if(S.inv[1]>0){S.inv[1]--;R.comet=3+.6*S.up[6]}if(S.inv[2]>0){S.inv[2]--;R.x2=20}R.rev=S.inv[3]>0?1:0;save();st='run';ui('');}
function pause(){if(st=='run'){st='pause';panel(`<h2>Paused</h2><button class="b p" onclick="resume()">Resume</button><br><button class="b" onclick="quit()">Quit to menu</button>`)}else if(st=='pause')resume()}
function resume(){st='run';ui('')}
function quit(){R=null;OB=[];CR=[];showMenu()}
function score(){return Math.floor(R.dist+R.cr*3+R.near*5)}
function addSB(s){const e={s,d:Math.floor(R.dist),c:CH[S.sel].n,n:S.pn||'Player'};S.sb.push(e);S.sb.sort((a,b)=>b.s-a.s);S.sb=S.sb.slice(0,10);return S.sb.indexOf(e)}
function die(){if(st!='run')return;
if(R.rev){R.rev=0;S.inv[3]--;save();R.inv=2.5;P.y=250;P.vy=0;sh=16;fl_=.8;ring={x:PX(),y:P.y,t:0};OB=OB.filter(o=>!(o.x>cam-60&&o.x<cam+W*.8));emit(PX(),P.y,40,'#fff',220,1);pop(PX(),P.y-40,'REVIVED!','#fff');sfx.pw();return}st='dying';sh=22;fl_=1;emit(PX(),P.y,50,B[bi].a,260,1.2);emit(PX(),P.y,25,CH[S.sel].c,200,1);sfx.dd();
S.cr+=Math.floor(R.cr);R.nb=0;const s=score();if(s>S.best){S.best=s;R.nb=1}R.rk=addSB(s);S.md=Math.max(S.md,Math.floor(R.dist));S.tot.c+=Math.floor(R.cr);S.tot.r++;addM('d',Math.floor(R.dist));chk();save();setTimeout(()=>{st='over';showOver()},900)}
/* ---------- spawning ---------- */
function line(x0,x1,y,n){for(let i=0;i<n;i++)CR.push({x:x0+(x1-x0)*(n>1?i/(n-1):.5),y:cl(y,CE+16,FL()-16),k:'c',o:i})}
function arc(x0,x1,y,a,n){for(let i=0;i<n;i++){const u=n>1?i/(n-1):.5;CR.push({x:x0+(x1-x0)*u,y:cl(y-Math.sin(u*Math.PI)*a,CE+16,FL()-16),k:'c',o:i})}}
function spawn(){const x=R.nx,lv=Math.min(R.dist/450,9),fl=FL();let w=50;
const pool=['isl','isl','spk','spk','stl'];if(lv>.8)pool.push('orb','str','bat');if(lv>2)pool.push('las','las','orb','bat');
const t=pool[Math.random()*pool.length|0];
if(t=='isl'){const h=rnd(44,64);w=rnd(80,120);const cy=rnd(CE+h/2+64,fl-h/2-64);OB.push({t,x,w,h,cy});const up=cy>(CE+fl)/2;arc(x-10,x+w+10,up?cy-h/2-40:cy+h/2+40,up?-20:20,5)}
else if(t=='spk'){const n=2+(Math.random()*3|0),h=rnd(45,95);w=n*30;OB.push({t,x,w,h});arc(x-10,x+w+10,fl-h-52,34,5)}
else if(t=='stl'){const n=2+(Math.random()*3|0),h=rnd(55,125);w=n*30;OB.push({t,x,w,h});arc(x-10,x+w+10,CE+h+52,-34,5)}
else if(t=='orb'){w=40;OB.push({t,x,y0:rnd(170,fl-120),a:rnd(40,110),f:rnd(1.5,2.6),ph:rnd(0,6),r:20})}
else if(t=='str'){w=rnd(170,260);OB.push({t,x,w});arc(x-10,x+w+10,fl-100,20,7)}
else if(t=='las'){w=30;OB.push({t,x,f:rnd(.8,1.2),ph:rnd(0,2)})}
else{const n=1+(lv>3?1:0)+(lv>6?1:0);for(let i=0;i<n;i++)OB.push({t:'bat',x:x+i*110,y:rnd(110,fl-90),ph:rnd(0,6)});w=n*110}
const gap=(spd()*.85+130+rnd(0,70))*(st=='intro'?.65:1);R.nx=x+w+gap;const mx=x+w+gap/2,my=rnd(130,fl-110),r=Math.random();
if(r<.1+.02*S.up[9])CR.push({x:mx,y:my,k:'p',p:['shd','mag','slow','x2','comet','pulse','feather','shower'][Math.random()*8|0]});else if(r<.125+.03*S.up[9])CR.push({x:mx,y:my,k:'g'});else if(r<.62)line(x+w+50,R.nx-50,my,Math.max(3,gap/48|0))}
function lside(o){return o.lk?o.lk-1:Math.floor((R.t*o.f+o.ph)%2)}
function shp(o){const fl=FL();switch(o.t){
case'isl':return[{x:o.x+o.w*.08,y:o.cy-o.h*.4,w:o.w*.84,h:o.h*.8}];
case'spk':return[{x:o.x+o.w*.12,y:fl-o.h*.8,w:o.w*.76,h:o.h*.8}];
case'stl':return[{x:o.x+o.w*.12,y:CE,w:o.w*.76,h:o.h*.8}];
case'str':return[{x:o.x,y:fl-18,w:o.w,h:18}];
case'orb':return[{c:1,x:o.x,y:o.y0+Math.sin(R.t*o.f+o.ph)*o.a,r:o.r-3}];
case'bat':return[{c:1,x:o.x,y:o.y+Math.sin(R.t*3+o.ph)*28,r:11}];
case'las':{const h=(fl-CE)/2-12;return lside(o)?[{x:o.x-5,y:CE+h+24,w:10,h}]:[{x:o.x-5,y:CE,w:10,h}]}}return[]}
function gp(s,cx,cy,r){if(s.c)return Math.hypot(s.x-cx,s.y-cy)-s.r-r;const dx=Math.max(s.x-cx,0,cx-s.x-s.w),dy=Math.max(s.y-cy,0,cy-s.y-s.h);return Math.hypot(dx,dy)-r}
/* ---------- update ---------- */
